# Platform pieces every tenant relies on. Applied with Flux's own permissions, so changes here
# need Steve's review (see .github/CODEOWNERS).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
  timeout: 10m
---
# Objects that need the controllers' CRDs to exist first (e.g. ClusterIssuer from cert-manager).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  serviceAccountName: kustomize-controller
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/config
  prune: true
  wait: true
