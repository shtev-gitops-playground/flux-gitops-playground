# One namespace, set of permissions and pair of Flux syncs per player (platform/tenants/<you>).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-config
  serviceAccountName: kustomize-controller
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/tenants
  prune: true
