apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: demo-app
          # The comment below is a marker: Flux's image automation rewrites this line when your
          # ImagePolicy picks a newer tag, then commits the change to Git.
          image: ghcr.io/shtev-gitops-playground/demo-app:base-1.0.0 # {"$imagepolicy": "flux-system:shtev-demo-app"}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
