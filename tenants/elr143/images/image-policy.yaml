# Which of your releases to run. Only tags starting "elr143-" are yours; the rest of the tag
# is read as a version and the highest one in the range wins. Try range: "~1.1" to pin to 1.1.x.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: elr143-demo-app
spec:
  imageRepositoryRef:
    name: demo-app
  filterTags:
    pattern: '^elr143-(?P<version>.+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=1.0.0"
