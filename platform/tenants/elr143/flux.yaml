# Your own copy of the repo, read anonymously over HTTPS (it's public) and trimmed to your folder.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: playground
  namespace: play-elr143
spec:
  interval: 1m
  url: https://github.com/shtev-gitops-playground/flux-gitops-playground
  ref:
    branch: main
  ignore: |
    /*
    !/tenants/elr143/app/
---
# Applies tenants/elr143/app into play-elr143, acting as flux-tenant, so it can't reach anything else.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: play-elr143
spec:
  serviceAccountName: flux-tenant
  interval: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: playground
  path: ./tenants/elr143/app
  targetNamespace: play-elr143
  prune: true
  wait: true
  timeout: 3m
---
# Applies tenants/elr143/images into flux-system, acting as an account that can only touch ImagePolicies.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elr143-images
  namespace: flux-system
spec:
  serviceAccountName: tenant-images-elr143
  interval: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants/elr143/images
  targetNamespace: flux-system
  prune: true
