apiVersion: v1
kind: Namespace
metadata:
  name: play-__LC__
  labels:
    playground.shtev.dev/tenant: __LC__
    # Pod Security: refuse anything that could reach the node (privileged, host paths, host
    # network). "restricted" is only a warning, so ordinary images like nginx still run.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
