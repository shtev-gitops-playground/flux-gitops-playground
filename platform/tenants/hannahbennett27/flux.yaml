# Your own copy of the repo, read anonymously over HTTPS (it's public) and trimmed to your folder.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: playground
  namespace: play-hannahbennett27
spec:
  interval: 1m
  url: https://github.com/shtev-gitops-playground/flux-gitops-playground
  ref:
    branch: main
  ignore: |
    /*
    !/tenants/hannahbennett27/app/
---
# Applies tenants/hannahbennett27/app into play-hannahbennett27, acting as flux-tenant, so it can't reach anything else.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: play-hannahbennett27
spec:
  serviceAccountName: flux-tenant
  interval: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: playground
  path: ./tenants/hannahbennett27/app
  targetNamespace: play-hannahbennett27
  prune: true
  wait: true
  timeout: 3m
---
# Applies tenants/hannahbennett27/images into flux-system, acting as an account that can only touch ImagePolicies.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hannahbennett27-images
  namespace: flux-system
spec:
  serviceAccountName: tenant-images-hannahbennett27
  interval: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants/hannahbennett27/images
  targetNamespace: flux-system
  prune: true
