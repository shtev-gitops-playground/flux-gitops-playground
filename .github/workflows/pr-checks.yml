# Runs on every PR. tenant-paths and gitleaks are required by the ruleset on main.
name: pr-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  tenant-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Only your own tenants/ folder
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # Whoever triggered this run (opened the PR or pushed to it); stays the same on a re-run.
          PUSHER: ${{ github.actor }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git -c core.quotePath=false diff --name-status "$BASE...$HEAD" | scripts/tenant-paths.sh "$AUTHOR" "$PUSHER"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          v=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - name: Scan this PR's commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --log-opts="$BASE..$HEAD" .'

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          v=0.8.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v$v/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v$v/CHECKSUMS"
          grep "kubeconform-linux-amd64.tar.gz" CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Manifests build and match their schemas
        run: scripts/validate-manifests.sh
      - name: Script tests
        run: |
          scripts/test/tenant-paths.test.sh
          scripts/test/release-tag.test.sh
          scripts/test/new-tenant.test.sh
      - name: Demo app tests
        working-directory: apps/demo-app
        run: go test ./...
