# Scans every push to main for secrets, including the operator's direct pushes,
# which skip the PR checks.
name: gitleaks-main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          v=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - name: Scan the pushed commits for secrets
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --log-opts="$BEFORE..$AFTER" .'
