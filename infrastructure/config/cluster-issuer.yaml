# Let's Encrypt via HTTP-01: cert-manager answers the challenge through Traefik on port 80.
# No contact email: this repo is public, and ACME doesn't require one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
