# In a player's namespace, Services stay inside the cluster. LoadBalancer, NodePort and
# externalIPs would all open ports on the server itself (even 6443 or 22).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
    namespaceSelector:
      matchExpressions:
        - key: playground.shtev.dev/tenant
          operator: Exists
  validations:
    - expression: "!has(object.spec.type) || object.spec.type in ['ClusterIP', 'ExternalName']"
      message: "In this namespace, Services must be ClusterIP (use an Ingress to reach them from outside)"
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "In this namespace, Services can't use externalIPs"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-services
spec:
  policyName: tenant-services
  validationActions: [Deny]
