# kubeconfig for the GitOps Playground. No secrets in here: your credentials come from logging in
# with GitHub (via Dex) the first time you run a kubectl command.
#   export KUBECONFIG=$PWD/kubeconfig/playground.yaml
#   kubectl auth whoami
apiVersion: v1
kind: Config
clusters:
  - name: playground
    cluster:
      server: https://api.gitops.shtev.dev:6443
      # The cluster's own CA certificate (public), so kubectl can trust the API server.
      certificate-authority-data: 
users:
  - name: github
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://dex.gitops.shtev.dev
          - --oidc-client-id=kubernetes
          - --oidc-extra-scope=groups
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=offline_access
          # No browser (e.g. some WSL setups or over SSH)? Uncomment to log in with a code instead:
          # - --grant-type=device-code
        interactiveMode: IfAvailable
contexts:
  - name: playground
    context:
      cluster: playground
      user: github
current-context: playground
